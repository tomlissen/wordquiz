<div
  class="drop"
  [class.dragging]="dragging()"
  (dragover)="onDragOver($event)"
  (dragleave)="dragging.set(false)"
  (drop)="onDrop($event)"
>
  <p class="drop-title">{{ 'upload.drop' | translate }}</p>
  <p class="drop-or">
    {{ 'upload.or' | translate }}
    <label class="btn btn-primary">
      {{ 'upload.choose' | translate }}
      <input #picker type="file" accept=".json,application/json" multiple class="visually-hidden" (change)="onPick(picker)" />
    </label>
  </p>
  <p class="built-in muted">
    {{ 'upload.builtInPrompt' | translate }}
    <button type="button" class="btn-link" (click)="builtIn.open()">{{ 'upload.builtInButton' | translate }}</button>
  </p>
  <app-built-in-quiz-dialog #builtIn (picked)="addBuiltIn($event)" />
</div>

@if (messages().length) {
  <ul class="messages" aria-live="polite">
    @for (m of messages(); track $index) {
      <li class="banner" [class.banner-error]="m.kind === 'error'">{{ m.text }}</li>
    }
  </ul>
}
